{% extends "./plantillaPrin.html" %}
{% block contenido %}
<div class="container">
    <div class="row">
        <div class="col-md-3"></div>
        <div class="col-md-6">
            <br>
            <h1><b>Actualizar Curso</b></h1>
            <hr>
            <form id="form_editar_curso" action="/actualizarCurso/{{ curso.id }}/" method="post">
                {% csrf_token %}
                <b>Nombre del Curso:</b> <br>
                <input required minlength="3" maxlength="100" placeholder="Ingrese el nombre del curso" class="form-control" type="text" name="nombre" value="{{ curso.nombre }}">
                <br>
                <b>Descripción:</b> <br>
                <textarea placeholder="Ingrese una breve descripción" class="form-control" name="descripcion">{{ curso.descripcion }}</textarea>
                <br>
                <b>Instructor:</b> <br>
                <input required minlength="3" maxlength="100" placeholder="Ingrese el nombre del instructor" class="form-control" type="text" name="instructor" value="{{ curso.instructor }}">
                <br>
                <b>Horas de duración:</b> <br>
                <input required min="1" max="1000" placeholder="Ingrese las horas de duración" class="form-control" type="number" name="horas_duracion" value="{{ curso.horas_duracion }}">
                <br>
                <b>Fecha de inicio:</b> <br>
                <input required class="form-control" type="date" name="fecha_inicio" value="{{ curso.fecha_inicio|date:'Y-m-d' }}">
                <br>
                <b>Fecha de fin:</b> <br>
                <input required class="form-control" type="date" name="fecha_fin" value="{{ curso.fecha_fin|date:'Y-m-d' }}">
                <br>
                <br>
                <button class="btn btn-success" type="submit">Actualizar</button>
                <a href="/listadoCursos/" class="btn btn-secondary"><i class="ti-close"></i> Cancelar</a>
            </form>
            <br>
        </div>
    </div>
</div>

<script>
    $("#form_editar_curso").validate({
        rules: {
            nombre: { required: true, minlength: 3, maxlength: 100 },
            instructor: { required: true, minlength: 3, maxlength: 100 },
            horas_duracion: { required: true, number: true, min: 1, max: 1000 },
            fecha_inicio: { required: true },
            fecha_fin: { required: true }
        },
        messages: {
            nombre: {
                required: "Por favor, ingrese el nombre del curso",
                minlength: "El nombre debe tener al menos 3 caracteres"
            },
            instructor: {
                required: "Por favor, ingrese el nombre del instructor"
            },
            horas_duracion: {
                required: "Por favor, ingrese las horas de duración",
                number: "Solo se permiten números",
                min: "Debe ser al menos 1 hora",
                max: "No puede exceder 1000 horas"
            },
            fecha_inicio: { required: "Seleccione la fecha de inicio" },
            fecha_fin: { required: "Seleccione la fecha de fin" }
        }
    });
</script>
{% endblock %}
